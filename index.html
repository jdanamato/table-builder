<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Table to PDF</title>
    <!-- Painted before the stylesheet loads, so the page never flashes the
         wrong colour — and a stalled load shows the app background rather
         than an unexplained black rectangle. Matches --background. -->

      @media (prefers-color-scheme: dark) { :root { background: #111113; } }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
